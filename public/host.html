<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>主催者コントロール</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<div class="wrap wide">
  <h1>🎛️ 主催者コントロール <span class="pill" id="phasePill">―</span></h1>

  <!-- ===== 準備（作問）画面 ===== -->
  <section id="setup">
    <div class="card">
      <h2 style="margin-top:0">クイズの設定</h2>
      <label>タイトル</label>
      <input id="title" value="懇親会クイズ大会" maxlength="40" />

      <label>採点方式</label>
      <div class="row">
        <label class="radio"><input type="radio" name="scoring" value="correct" checked> 正解数のみ</label>
        <label class="radio"><input type="radio" name="scoring" value="speed"> 正解＋早押し順で加点</label>
      </div>

      <label>テーブル（グループ）名 ― 1行に1つ</label>
      <textarea id="tables" rows="5" placeholder="Aテーブル&#10;Bテーブル&#10;Cテーブル"></textarea>
    </div>

    <div class="card">
      <h3 style="margin-top:0">問題</h3>
      <div id="questions"></div>
      <button class="ghost" id="addQ">＋ 問題を追加</button>
    </div>

    <button class="green" id="saveBtn">💾 保存して受付を開始</button>
    <p class="muted" id="setupMsg"></p>
  </section>

  <!-- ===== 進行コントロール画面 ===== -->
  <section id="control" style="display:none">
    <div class="grid2">
      <div class="card">
        <h2 id="ctlTitle" style="margin-top:0"></h2>
        <p class="muted" id="ctlMeta"></p>
        <div class="row">
          <button id="nextBtn" class="green">▶ 次の問題</button>
          <button id="closeBtn" class="ghost">⏱ 締切＆採点</button>
        </div>
        <div class="row" style="margin-top:10px">
          <button id="finishBtn">🏆 最終結果を発表</button>
        </div>
        <div class="row" style="margin-top:10px">
          <button id="backBtn" class="ghost">← 作問に戻る</button>
          <button id="resetBtn" class="danger">⟲ 得点リセット</button>
        </div>
        <p class="muted" style="margin-top:14px">
          参加用URL: <b id="joinUrl"></b><br>会場表示: <b id="dispUrl"></b>
        </p>
      </div>

      <div class="card">
        <h3 style="margin-top:0">現在の問題・回答状況</h3>
        <div id="liveArea"><p class="muted">「次の問題」で開始します。</p></div>
      </div>
    </div>

    <div class="card">
      <h3 style="margin-top:0">🪑 テーブルの参加状況</h3>
      <p class="muted">「解放」を押すと枠が空き、代表者の交代ができます。</p>
      <div id="tableStatus"></div>
    </div>

    <div class="card" id="standingsCard" style="display:none">
      <h3 style="margin-top:0">🏆 最終順位</h3>
      <ol class="standings" id="standings"></ol>
    </div>
  </section>
</div>

<script src="/firebase-config.js"></script>
<script type="module" src="/host.js"></script>
</body>
</html>
